# Full mutation run on main + nightly.
# Saves the incremental baseline that PR runs start from.
name: Mutation testing (main)

on:
  push:
    branches: [main]
    paths: ['demo/**']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: demo

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci

      - name: Restore incremental report
        uses: actions/cache@v6
        with:
          path: demo/reports/stryker-incremental.json
          key: stryker-incremental-main-${{ github.sha }}
          restore-keys: stryker-incremental-main-

      # Nightly runs ignore the cache and re-test everything (catches drift, e.g. dependency updates).
      - run: npx stryker run ${{ github.event_name == 'schedule' && '--force' || '' }}

      - name: Mutation score to job summary
        if: always()
        run: node ../ci-samples/score-summary.mjs reports/mutation/mutation.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: demo/reports/mutation/mutation.html
