# Full mutation run on main + nightly.
# Saves the incremental baseline that PR runs start from.
name: Mutation testing (main)

on:
  push:
    branches: [main]
    paths: ['demo/**', 'ci-samples/**']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: demo

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci

      - name: Restore incremental report
        uses: actions/cache@v6
        with:
          path: demo/reports/stryker-incremental.json
          key: stryker-incremental-main-${{ github.sha }}
          restore-keys: stryker-incremental-main-

      # Nightly runs ignore the cache and re-test everything (catches drift, e.g. dependency updates).
      - run: npx stryker run ${{ github.event_name == 'schedule' && '--force' || '' }}

      # Optional strict run for validation schemas (static mutants on), see demo/stryker.schemas.config.mjs.
      - name: Stryker (schemas)
        if: always() && hashFiles('demo/stryker.schemas.config.mjs') != ''
        run: npx stryker run stryker.schemas.config.mjs ${{ github.event_name == 'schedule' && '--force' || '' }}

      - name: Report to job summary
        if: always() && hashFiles('demo/reports/mutation/mutation.json') != ''
        run: |
          node ../ci-samples/report.mjs reports/mutation/mutation.json reports/mutation/schemas.json --out reports/mutation/report.md
          cat reports/mutation/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: |
            demo/reports/mutation/mutation.html
            demo/reports/mutation/schemas.html

      # Baseline for PRs ("+/- vs main" in the PR comment).
      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-json
          path: |
            demo/reports/mutation/mutation.json
            demo/reports/mutation/schemas.json
          retention-days: 90
