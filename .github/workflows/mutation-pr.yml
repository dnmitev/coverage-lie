# Mutation testing on pull requests.
# - incremental: only mutants in changed code (or covered by changed tests) are re-tested
# - sticky PR comment: score, change vs main, score on the lines this PR changed, survivors as diffs
# - inline annotations on the PR diff for every surviving mutant
# - gates: overall score (thresholds.break), score on changed lines, new disable comments without a reason
# Every step runs and reports first; the gates fail the job at the end.
name: Mutation testing (PR)

on:
  pull_request:
    paths: ['demo/**']

concurrency:
  group: mutation-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # download the baseline report from main
  pull-requests: write # sticky comment

defaults:
  run:
    working-directory: demo

env:
  CHANGED_LINES_MIN_SCORE: 80 # new code is held to a higher bar than the legacy average
  REPORT_PATH_PREFIX: demo/ # report paths are relative to demo/, annotations need repo paths
  GH_TOKEN: ${{ github.token }}

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to diff against the base branch
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci

      - name: Restore incremental report
        uses: actions/cache@v6
        with:
          path: demo/reports/stryker-incremental.json
          key: stryker-incremental-${{ github.head_ref }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ github.head_ref }}-
            stryker-incremental-main-

      - name: Download baseline report from main
        continue-on-error: true
        run: |
          run=$(gh run list --workflow mutation-main.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$run" --name mutation-json --dir ../baseline

      # Fails when the score drops below thresholds.break (stryker.config.json).
      - name: Stryker
        id: stryker
        run: npx stryker run

      # Optional strict run for validation schemas (static mutants on), see demo/stryker.schemas.config.mjs.
      - name: Stryker (schemas)
        if: always() && hashFiles('demo/stryker.schemas.config.mjs') != ''
        run: npx stryker run stryker.schemas.config.mjs

      - name: Report (job summary + annotations)
        if: always() && hashFiles('demo/reports/mutation/mutation.json') != ''
        run: |
          node ../ci-samples/report.mjs reports/mutation/mutation.json reports/mutation/schemas.json \
            --baseline ../baseline/mutation.json --base "origin/$GITHUB_BASE_REF" \
            --out reports/mutation/report.md --annotations
          cat reports/mutation/report.md >> "$GITHUB_STEP_SUMMARY"
          node ../ci-samples/survivors-to-prompt.mjs reports/mutation/mutation.json > reports/mutation/agent-prompt.md
          [ -f reports/mutation/schemas.json ] && node ../ci-samples/survivors-to-prompt.mjs reports/mutation/schemas.json >> reports/mutation/agent-prompt.md || true

      # One comment per PR, updated on every push. Fails silently on fork PRs (read-only token).
      - name: Sticky PR comment
        if: always() && hashFiles('demo/reports/mutation/report.md') != ''
        continue-on-error: true
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- stryker-report -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@reports/mutation/report.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@reports/mutation/report.md > /dev/null
          fi

      - name: Upload HTML report and agent prompt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: |
            demo/reports/mutation/mutation.html
            demo/reports/mutation/schemas.html
            demo/reports/mutation/agent-prompt.md
            demo/reports/mutation/report.md

      - name: Gates (new code score, disable comments)
        if: always() && hashFiles('demo/reports/mutation/mutation.json') != ''
        run: |
          node ../ci-samples/report.mjs reports/mutation/mutation.json reports/mutation/schemas.json --base "origin/$GITHUB_BASE_REF" \
            --gate-changed "$CHANGED_LINES_MIN_SCORE" --gate-disables
